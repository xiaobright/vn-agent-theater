<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>全员存取档 · 角色剧场</title>
<style>
  :root{
    --bg:#0e1116; --panel:#151a22; --panel2:#1b222c; --line:#263040;
    --fg:#dfe6f1; --dim:#8a97a8; --dim2:#66727f;
    --accent:#4c8dff; --ok:#3fbf7f; --warn:#e0a44a; --bad:#e4614f; --rewind:#b07bff;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:14px/1.6 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  a{color:var(--accent)}
  header{position:sticky;top:0;z-index:10;background:rgba(14,17,22,.94);
         backdrop-filter:blur(6px);border-bottom:1px solid var(--line);
         padding:10px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.02em}
  .tabs{display:flex;gap:4px}
  .tab{padding:4px 12px;border-radius:6px;border:1px solid transparent;cursor:pointer;
       color:var(--dim);font-size:13px;background:none;white-space:nowrap}
  .tab.on{background:var(--panel2);color:var(--fg);border-color:var(--line)}
  .pill{font-size:12px;padding:2px 9px;border-radius:999px;border:1px solid var(--line);
        color:var(--dim);font-family:var(--mono)}
  .pill.run{color:var(--accent);border-color:#2c4a80}
  .pill.done{color:var(--ok);border-color:#27583f}
  .pill.err{color:var(--bad);border-color:#6b2f27}
  main{padding:14px 16px 60px;max-width:1900px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;
        padding:12px 14px;margin-bottom:12px}
  .card h2{font-size:12px;margin:0 0 10px;color:var(--dim);font-weight:600;
           text-transform:uppercase;letter-spacing:.08em}
  .grid{display:grid;gap:12px}
  .g3{grid-template-columns:340px minmax(0,1fr) minmax(0,1.15fr)}
  @media(max-width:1200px){.g3{grid-template-columns:1fr}}
  label{display:block;font-size:12px;color:var(--dim);margin:8px 0 3px}
  input,select,textarea,button{font:inherit;background:var(--panel2);color:var(--fg);
        border:1px solid var(--line);border-radius:6px;padding:6px 8px;width:100%}
  textarea{min-height:74px;resize:vertical;font-size:13px}
  button{cursor:pointer;background:var(--panel2)}
  button:hover{border-color:#3a4a63}
  button.primary{background:#1d4ed8;border-color:#2f5fd0;color:#fff}
  button.primary:disabled{background:#232c3a;border-color:var(--line);color:var(--dim2);cursor:default}
  .row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap}
  .row>*{flex:1}
  .row .tight{flex:0 0 auto;width:auto}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:4px}
  .chip{font-size:12px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
        cursor:pointer;color:var(--dim);background:var(--panel2);user-select:none}
  .chip.on{color:#fff;border-color:transparent}
  .mono{font-family:var(--mono);font-size:12px}
  .dim{color:var(--dim)}
  .dim2{color:var(--dim2)}
  pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:var(--mono);font-size:12px}
  .log{max-height:340px;overflow:auto}
  .ev{padding:6px 0;border-bottom:1px solid #1e2530;display:flex;gap:8px}
  .ev:last-child{border-bottom:none}
  .ev .t{flex:0 0 52px;color:var(--dim2);font-family:var(--mono);font-size:11px;padding-top:2px}
  .ev .b{flex:1;min-width:0}
  .ev.hl{background:#1a2130;margin:0 -8px;padding:6px 8px;border-radius:6px}
  .tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:4px;
       border:1px solid var(--line);color:var(--dim);margin-right:6px;font-family:var(--mono)}
  .tag.scene{color:#8fb3ff;border-color:#2b3d63}
  .tag.turn{color:var(--fg)}
  .tag.state{color:var(--dim2)}
  .tag.memory{color:var(--rewind);border-color:#4a3570}
  .tag.pause,.tag.interface{color:var(--warn);border-color:#5c4620}
  .tag.note{color:#6fd0c0;border-color:#2a5c56}
  .ctx{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
  .col{background:var(--panel2);border:1px solid var(--line);border-radius:8px;
       display:flex;flex-direction:column;min-width:0}
  .col h3{margin:0;padding:8px 10px;font-size:13px;border-bottom:1px solid var(--line);
          display:flex;justify-content:space-between;align-items:center}
  .col .body{padding:8px 10px;max-height:460px;overflow:auto}
  .blk{margin-bottom:9px}
  .blk .h{font-size:11px;color:var(--dim2);font-family:var(--mono);margin-bottom:3px}
  .blk .e{font-size:12.5px;padding:3px 0 3px 8px;border-left:2px solid #2b3648;margin:2px 0;
          white-space:pre-wrap;word-break:break-word}
  .blk .e.mine{border-left-color:var(--accent)}
  .blk .e.priv{border-left-color:var(--warn);color:#cbbfa6}
  .blk .e.mem{border-left-color:var(--rewind);color:#c3aee8}
  .blk .e.st{border-left-color:#3a4453;color:var(--dim)}
  .issues{margin:0;padding-left:18px}
  .issues li{margin:3px 0;color:#f0b8ae}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;font-size:12px}
  .kv .k{color:var(--dim)}
  .badge{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
  .empty{color:var(--dim2);font-size:12.5px;padding:10px 0}
  .hidden{display:none}
  .prose{white-space:pre-wrap;max-height:460px;overflow:auto;line-height:1.85}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11.5px;color:var(--dim);margin-top:8px}
  .legend span{display:flex;align-items:center;gap:5px}
</style>
</head>
<body>
<header>
  <h1>全员存取档 · 实验台</h1>
  <div class="tabs">
    <button class="tab on" data-tab="theater">角色剧场</button>
    <button class="tab" data-tab="pipeline">协作模式 / 工作台</button>
  </div>
  <span id="status" class="pill">idle</span>
  <span id="provider" class="pill dim2"></span>
  <span id="calls" class="pill dim2"></span>
</header>

<main>
<!-- ================= 角色剧场 ================= -->
<section id="tab-theater">
  <div class="card">
    <h2>开演</h2>
    <label>本场目标</label>
    <textarea id="t-request" placeholder="留空用内置示例"></textarea>
    <div class="row">
      <div><label>出场角色</label><div id="t-cast" class="chips"></div></div>
      <div class="tight" style="width:110px"><label>轮数</label>
        <input id="t-turns" type="number" min="1" max="20" value="4"></div>
      <div style="width:150px"><label>起始世界日期</label>
        <input id="t-date" value="第三天·夜"></div>
      <div style="width:130px"><label>provider</label><select id="t-provider"></select></div>
      <div class="tight" style="width:auto"><label>选项</label>
        <div class="chips">
          <span id="t-mock" class="chip on">mock</span>
          <span id="t-observe" class="chip on">观察者</span>
        </div>
      </div>
      <div class="tight" style="width:auto"><label>&nbsp;</label>
        <button id="t-run" class="primary">开演</button></div>
      <div class="tight" style="width:auto"><label>&nbsp;</label>
        <button id="t-cancel">取消</button></div>
    </div>
    <div class="legend">
      <span><i class="badge" style="background:#8fb3ff"></i>世界事件</span>
      <span><i class="badge" style="background:var(--accent)"></i>该角色的行动</span>
      <span><i class="badge" style="background:var(--warn)"></i>只他知道（内心 / 界面 / 暂停）</span>
      <span><i class="badge" style="background:var(--rewind)"></i>记忆覆盖层（读档者豁免）</span>
      <span><i class="badge" style="background:#3a4453"></i>每轮结尾注入的状态</span>
    </div>
  </div>

  <div class="grid g3">
    <div>
      <div class="card"><h2>快照图 · 分支与指针</h2>
        <div id="t-graph"></div>
        <div id="t-slots" class="mono" style="margin-top:10px"></div>
      </div>
      <div class="card"><h2>世界动作</h2>
        <div id="t-history" class="log mono"></div>
      </div>
    </div>

    <div>
      <div class="card"><h2>客观事件日志（事实）</h2>
        <div id="t-objective" class="log"></div>
      </div>
      <div class="card"><h2>观察者</h2>
        <div id="t-observer"></div>
      </div>
      <div class="card"><h2>结构层 / 界面操作 / 被丢弃的意图</h2>
        <div id="t-issues"></div>
      </div>
      <div class="card"><h2>正文（写手渲染）</h2>
        <div id="t-prose" class="prose"></div>
      </div>
    </div>

    <div>
      <div class="card"><h2>各角色的上下文（并排）</h2>
        <div id="t-contexts" class="ctx"></div>
      </div>
      <div class="card"><h2>信念 vs 事实</h2>
        <div id="t-belief"></div>
      </div>
    </div>
  </div>
</section>

<!-- ================= 协作模式 / 工作台 ================= -->
<section id="tab-pipeline" class="hidden">
  <div class="card">
    <h2>跑一次</h2>
    <label>创作要求</label>
    <textarea id="p-request" placeholder="留空用内置示例"></textarea>
    <div class="row">
      <div style="width:230px"><label>模式</label><select id="p-mode"></select></div>
      <div style="width:130px"><label>provider</label><select id="p-provider"></select></div>
      <div class="tight" style="width:auto"><label>选项</label>
        <div class="chips"><span id="p-mock" class="chip on">mock</span>
          <span id="p-loop" class="chip on">审查闭环</span></div>
      </div>
      <div class="tight" style="width:auto"><label>&nbsp;</label>
        <button id="p-run" class="primary">开跑</button></div>
    </div>
  </div>
  <div class="grid g3">
    <div>
      <div class="card"><h2>阶段</h2><div id="p-stages"></div></div>
      <div class="card"><h2>草稿列表</h2><div id="p-runs" class="log"></div></div>
    </div>
    <div>
      <div class="card"><h2>场景稿</h2><div id="p-scene" class="prose"></div></div>
      <div class="card"><h2>审读 / 审查</h2><div id="p-review"></div></div>
    </div>
    <div>
      <div class="card"><h2>状态提案</h2><div id="p-proposal"></div></div>
      <div class="card"><h2>账本</h2><div id="p-ledger" class="mono log"></div></div>
    </div>
  </div>
</section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const COLORS = ["#4c8dff","#e0a44a","#3fbf7f","#e4614f","#b07bff","#6fd0c0","#d98cc4","#9fb04a"];
const colorOf = (name, all) => COLORS[Math.max(0, all.indexOf(name)) % COLORS.length];

/* ---------- tabs ---------- */
let tab = "theater";
document.querySelectorAll(".tab").forEach((b) => b.onclick = () => {
  tab = b.dataset.tab;
  document.querySelectorAll(".tab").forEach((x) => x.classList.toggle("on", x === b));
  $("tab-theater").classList.toggle("hidden", tab !== "theater");
  $("tab-pipeline").classList.toggle("hidden", tab !== "pipeline");
  if (tab === "pipeline") loadRuns();
});
const chip = (el, init) => { el.classList.toggle("on", init); el.onclick = () => el.classList.toggle("on"); return el; };

/* ---------- 剧场 ---------- */
let cast = ["主角","首领"], known = [], providers = [];
function renderCast(){
  $("t-cast").innerHTML = known.map((n,i) =>
    `<span class="chip ${cast.includes(n)?"on":""}" data-n="${esc(n)}"
       style="${cast.includes(n)?`background:${colorOf(n,known)};`:""}">${esc(n)}</span>`).join("");
  $("t-cast").querySelectorAll(".chip").forEach((el) => el.onclick = () => {
    const n = el.dataset.n;
    cast = cast.includes(n) ? cast.filter((x) => x !== n) : [...cast, n];
    renderCast();
  });
}
function renderProviders(){
  const opts = providers.map((p) => `<option value="${esc(p.name)}">${esc(p.label)}</option>`).join("");
  $("t-provider").innerHTML = opts; $("p-provider").innerHTML = opts;
}

function drawGraph(g, state){
  if(!g || !g.branches){ $("t-graph").innerHTML = '<div class="empty">还没有开演。</div>'; return; }
  const names = Object.keys(g.slots || {});
  const order = g.branches.map((b) => b.id);
  const maxTurn = Math.max(1, ...g.branches.map((b) => Math.max(b.tail_turn, b.fork_turn)));
  const stepX = 46, stepY = 40, padL = 60, padT = 16;
  const W = padL + (maxTurn + 1) * stepX + 30, H = padT + order.length * stepY + 34;
  const X = (t) => padL + t * stepX, Y = (b) => padT + order.indexOf(b) * stepY + 14;
  let svg = `<svg viewBox="0 0 ${W} ${H}" width="100%" style="min-width:420px">`;
  // 轮次刻度
  for(let t = 0; t <= maxTurn; t++){
    svg += `<line x1="${X(t)}" y1="${padT-6}" x2="${X(t)}" y2="${H-24}" stroke="#1e2530"/>`;
    svg += `<text x="${X(t)}" y="${H-10}" fill="#66727f" font-size="10" text-anchor="middle">${t}</text>`;
  }
  // 分支
  g.branches.forEach((b) => {
    const y = Y(b.id), live = g.live.branch === b.id;
    const x0 = X(b.fork_turn), x1 = X(Math.max(b.tail_turn, b.fork_turn));
    svg += `<line x1="${x0}" y1="${y}" x2="${x1}" y2="${y}" stroke="${live?"#3fbf7f":"#3a4a63"}"
            stroke-width="${live?2.5:1.6}" ${live?"":'stroke-dasharray="0"'}/>`;
    if(b.parent){
      const py = Y(b.parent);
      svg += `<path d="M ${x0} ${py} C ${x0+14} ${py}, ${x0-14} ${y}, ${x0} ${y}"
              fill="none" stroke="#b07bff" stroke-width="1.6" stroke-dasharray="4 3"/>`;
    }
    svg += `<text x="${padL-8}" y="${y+4}" fill="#8a97a8" font-size="10.5" text-anchor="end">${esc(b.id)}</text>`;
    if(live) svg += `<rect x="${X(g.live.turn)-9}" y="${y-9}" width="18" height="18" rx="4"
                     fill="none" stroke="#3fbf7f" stroke-width="2"/>`;
    svg += `<text x="${x1+8}" y="${y+4}" fill="#66727f" font-size="10">${esc(b.label||"")}</text>`;
  });
  // 槽位标记
  names.forEach((n) => {
    (g.slots[n] || []).forEach((s) => {
      if(!s) return;
      const bi = order.indexOf(s.branch); if(bi < 0) return;
      const y = Y(s.branch);
      svg += `<rect x="${X(s.turn)-5}" y="${y-5}" width="10" height="10" rx="2"
              fill="${colorOf(n,names)}" opacity="0.95"><title>${esc(n)} 槽${s.slot} · ${esc(s.world_date)} · ${esc(s.note||"")}</title></rect>`;
    });
  });
  svg += `</svg>`;
  $("t-graph").innerHTML = svg;

  $("t-slots").innerHTML = names.map((n) => {
    const cells = (g.slots[n] || []).map((s) => s
      ? `<span style="color:${colorOf(n,names)}">槽${s.slot}</span> <span class="dim2">${esc(s.branch)}·${s.turn}</span> <span class="dim">${esc(s.note||"（无备注）")}</span>`
      : `<span class="dim2">槽${(g.slots[n]||[]).indexOf(s)+1} 空</span>`).join(" &nbsp;|&nbsp; ");
    const st = (state && state[n]) || {};
    return `<div style="margin-bottom:4px"><i class="badge" style="background:${colorOf(n,names)}"></i>
      <b>${esc(n)}</b> ${st.alive===false?'<span style="color:var(--bad)">已死亡</span>':'存活'}
      <div style="margin-left:15px">${cells}</div></div>`;
  }).join("");
}

function renderObjective(rows){
  if(!rows || !rows.length){ $("t-objective").innerHTML = '<div class="empty">还没有事件。</div>'; return; }
  $("t-objective").innerHTML = rows.map((e) => {
    const cls = e.kind === "memory" ? "mem" : e.kind === "pause" || e.kind === "interface" ? "priv" : "";
    const who = e.actor ? `<span class="dim2">${esc(e.actor)}</span> ` : "";
    const present = e.present && e.present.length ? `<span class="dim2">在场：${esc(e.present.join("、"))}</span>` : "";
    return `<div class="ev"><div class="t">T${e.turn}</div><div class="b">
      <span class="tag ${esc(e.kind)}">${esc(e.kind)}</span>${who}
      <div class="${cls}">${esc(e.public)}</div>
      ${e.private ? `<div class="dim2 mono" style="font-size:11px">私：${esc(e.private.slice(0,160))}</div>` : ""}
      ${present}</div></div>`;
  }).join("");
}

function renderContexts(ctx, state, names){
  const keys = Object.keys(ctx || {});
  if(!keys.length){ $("t-contexts").innerHTML = '<div class="empty">还没有上下文。</div>'; return; }
  $("t-contexts").innerHTML = keys.map((n) => {
    const st = (state && state[n]) || {};
    const blocks = (ctx[n] || []).map((b) => {
      const evs = b.events.map((e) => {
        const mine = e.actor === n;
        const cls = e.kind === "memory" ? "mem" : e.kind === "state" ? "st" :
                    (e.kind === "pause" || e.kind === "interface") ? "priv" : mine ? "mine" : "";
        return `<div class="e ${cls}">${esc(e.text)}</div>`;
      }).join("");
      return `<div class="blk"><div class="h">第${b.turn}轮 · ${esc(b.world_date||"")}</div>${evs}</div>`;
    }).join("");
    return `<div class="col"><h3><span><i class="badge" style="background:${colorOf(n,keys)}"></i>${esc(n)}</span>
      <span class="dim2 mono" style="font-size:11px">${st.memory_events||0} 条记忆</span></h3>
      <div class="body">${blocks || '<div class="empty">空</div>'}</div></div>`;
  }).join("");
}

function renderBelief(b){
  if(!b || !b.objective){ $("t-belief").innerHTML = '<div class="empty">还没有数据。</div>'; return; }
  const names = Object.keys(b.knows || {});
  $("t-belief").innerHTML = `<div class="kv">${names.map((n) => `
    <div class="k"><i class="badge" style="background:${colorOf(n,names)}"></i>${esc(n)}</div>
    <div>看得见 <b>${(b.knows[n]||[]).length}</b> / ${b.objective.length} 条；
      盲区 <span class="dim2 mono">${(b.blind_spots[n]||[]).join(",") || "无"}</span></div>`).join("")}</div>
    <div class="dim2" style="margin-top:8px;font-size:11.5px">
      两个角色的盲区不同，隔离才是真的。盲区相同或都为空，就说明上下文漏了。</div>`;
}

function renderTheater(s){
  $("status").textContent = s.status || "idle";
  $("status").className = "pill " + (s.status === "running" ? "run" : s.status === "done" ? "done" : s.status === "error" ? "err" : "");
  $("provider").textContent = s.provider || "";
  $("calls").textContent = s.calls ? `${s.calls} 次调用` : "";
  if(s.error) $("t-observer").innerHTML = `<div style="color:var(--bad)">${esc(s.error)}</div>`;

  drawGraph(s.graph, s.state);
  renderObjective(s.objective);
  renderContexts(s.contexts, s.state, s.characters || []);
  renderBelief(s.belief);

  const hist = (s.history || []).slice(-40).reverse();
  $("t-history").innerHTML = hist.length ? hist.map((h) => {
    const c = h.kind === "load" ? "var(--rewind)" : h.kind === "kill" ? "var(--bad)" :
              h.kind === "save" ? "var(--ok)" : h.kind === "intent_discarded" ? "var(--warn)" : "var(--dim)";
    return `<div style="padding:2px 0"><span style="color:${c}">${esc(h.kind)}</span>
      <span class="dim2"> ${esc(h.branch)}·T${h.turn}</span> ${h.actor?`<span class="dim2">${esc(h.actor)}</span>`:""}
      <div class="dim">${esc(h.detail)}</div></div>`;
  }).join("") : '<div class="empty">还没有动作。</div>';

  const obs = s.observer || [];
  $("t-observer").innerHTML = (obs.length ? obs.map((r) => `
    <div style="margin-bottom:8px"><span class="pill ${r.status === "pause" ? "err" : "done"}">${esc(r.status)}</span>
    <span class="dim"> ${esc(r.reason || "")}</span>
    ${(r.divergences||[]).map((d) => `<div class="mono" style="margin:4px 0 0 8px;color:#f0b8ae">
      ${esc(d.who||"")} · ${esc(d.kind||"")}：${esc(d.detail||d.evidence||"")}</div>`).join("")}</div>`).join("")
    : (s.status === "running" ? '<div class="empty">等待第一轮结束…</div>' : '<div class="empty">还没有观察报告。</div>'));

  const issues = s.issues || [];
  $("t-issues").innerHTML = `
    ${s.paused ? `<div style="color:var(--bad);margin-bottom:8px">⏸ 已暂停：${esc(s.paused)}</div>` : ""}
    ${issues.length ? `<ul class="issues">${issues.map((i) =>
        `<li>${esc(i.kind)} · ${esc(i.actor||"")}：${esc(i.message || i.matched || "")}</li>`).join("")}</ul>`
      : '<div class="empty">没有结构层问题。</div>'}
    ${(s.ops||[]).length ? `<div class="mono" style="margin-top:8px">${s.ops.map((o) =>
        `<div>${o.ok?"✓":"✗"} ${esc(o.actor)} ${esc(o.op)} → ${esc(typeof o.detail === "string" ? o.detail : JSON.stringify(o.detail))}</div>`).join("")}</div>` : ""}
    ${(s.discarded||[]).length ? `<div class="mono" style="margin-top:8px;color:var(--warn)">
        ${s.discarded.map((d) => `<div>被覆盖、从未发生：${esc(d.actor)}「${esc(d.intent)}」输给了 ${esc(d.lost_to)}</div>`).join("")}</div>` : ""}`;

  $("t-prose").textContent = s.prose || "（还没有正文）";
}

/* ---------- 协作模式 ---------- */
let pMock = true, pLoop = true, modes = [];
function renderPipeline(s){
  $("p-stages").innerHTML = (s.stages || []).map((st) => {
    const c = st.status === "done" ? "var(--ok)" : st.status === "active" ? "var(--accent)" :
              st.status === "error" ? "var(--bad)" : "var(--dim2)";
    return `<div style="padding:3px 0"><span style="color:${c}">●</span>
      <b>${esc(st.label)}</b> <span class="dim2">${esc(st.desc||"")}</span></div>`;
  }).join("") || '<div class="empty">还没跑。</div>';
  $("p-scene").textContent = s.scene || "（空）";
  const chk = s.check || {};
  $("p-review").innerHTML = `
    ${s.workflow_status ? `<div>状态：<span class="mono">${esc(s.workflow_status)}</span>
      ${s.revisions ? ` · 修订 ${s.revisions} 次` : ""}</div>` : ""}
    ${chk.status ? `<div>审查：<span class="mono">${esc(chk.status)}</span></div>` : ""}
    ${(chk.issues||[]).map((i) => `<div class="mono" style="color:#f0b8ae">[${esc(i.kind)}] ${esc(i.message)}</div>`).join("")}
    <pre class="dim">${esc(s.review || "")}</pre>`;
  $("p-proposal").innerHTML = `<pre class="dim">${esc(JSON.stringify(s.proposal || {}, null, 2))}</pre>`;
  $("p-ledger").innerHTML = `<pre>${esc(JSON.stringify(s.ledger || {}, null, 2))}</pre>`;
}
async function loadRuns(){
  const r = await (await fetch("/api/runs")).json();
  $("p-runs").innerHTML = (r.runs || []).map((x) => `<div style="padding:4px 0;border-bottom:1px solid #1e2530">
    <span class="mono dim2">${esc(x.mode)}</span> <span class="dim">${esc((x.request||"").slice(0,26))}</span>
    <div class="mono dim2">${esc(x.workflow_status)} · ${esc(x.id)}</div></div>`).join("") || '<div class="empty">还没有草稿。</div>';
}

/* ---------- 轮询 ---------- */
let lastTheater = {}, lastPipeline = {};
async function tick(){
  try{
    const s = await (await fetch("/api/theater/state")).json();
    if(!known.length && s.known_characters){ known = s.known_characters; cast = known.slice(0,2); renderCast(); }
    if(!providers.length && s.providers){ providers = s.providers; renderProviders(); }
    if(!modes.length){
      const p = await (await fetch("/api/state")).json();
      modes = p.modes || [];
      $("p-mode").innerHTML = modes.map((m) => `<option value="${esc(m.name)}">${esc(m.label)}</option>`).join("");
      lastPipeline = p;
    }
    lastTheater = s; renderTheater(s);
    if(tab === "pipeline"){ renderPipeline(lastPipeline); }
  }catch(e){ /* 服务没起来时不要刷屏 */ }
}
setInterval(tick, 1200); tick();

/* ---------- 操作 ---------- */
chip($("t-mock"), true); chip($("t-observe"), true);
chip($("p-mock"), true); chip($("p-loop"), true);
$("t-run").onclick = async () => {
  const body = { request: $("t-request").value || null, provider: $("t-provider").value || null,
    mock: $("t-mock").classList.contains("on"), observe: $("t-observe").classList.contains("on"),
    turns: +$("t-turns").value || 4, cast, world_date: $("t-date").value || "第三天·夜" };
  $("t-run").disabled = true;
  const r = await (await fetch("/api/theater/run", { method:"POST",
    headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) })).json();
  if(!r.ok) alert(r.error || "启动失败");
  setTimeout(() => { $("t-run").disabled = false; }, 800);
};
$("t-cancel").onclick = () => fetch("/api/theater/cancel", { method:"POST" });
$("p-run").onclick = async () => {
  const body = { request: $("p-request").value || null, provider: $("p-provider").value || null,
    mode: $("p-mode").value, mock: $("p-mock").classList.contains("on"),
    closed_loop: $("p-loop").classList.contains("on") };
  const r = await (await fetch("/api/run", { method:"POST",
    headers:{ "Content-Type":"application/json" }, body: JSON.stringify(body) })).json();
  if(!r.ok) alert(r.error || "启动失败");
  setTimeout(loadRuns, 1200);
};
</script>
</body>
</html>
